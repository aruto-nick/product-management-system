<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>管理者詳細</title>
		<meta charset="UTF-8" />
	</head>
	<body>
		<h1>管理者詳細</h1>
		<table border="1">
			<tr>
				<th>店舗名</th>
				<th>姓</th>
				<th>名</th>
				<th>メールアドレス</th>
				<th>役職</th>
				<th>権限</th>
				<th>電話番号</th>
				<th>作成日時</th>
				<th>更新日時</th>
			</tr>
			<tr>
				<td th:text="${admin.storeName}"></td>
				<td th:text="${admin.lastName}"></td>
				<td th:text="${admin.firstName}"></td>
				<td th:text="${admin.email}"></td>
				<td th:text="${admin.positionName}"></td>
				<td th:text="${admin.authorityName}"></td>
				<td th:text="${admin.phoneNumber}"></td>
				<td th:text="${#temporals.format(
							admin.createdAt, 'yyyy年MM月dd日 HH:mm:ss')}"></td>
				<td th:text="${#temporals.format(
							admin.updatedAt, 'yyyy/MM/dd HH:mm:ss')}"></td>
			</tr>
		</table>
		<form th:action="@{/admin-delete}" method="post" 
				onsubmit="return confirm('本当に管理者情報を削除しますか？')">
			<input type="hidden" name="id" th:value="${admin.id}">
				<button type="submit">
					削除
				</button>
		</form>
		
		<a th:href="@{/admin-edit(id=${admin.id})}">
			編集
		</a>
	</body>
</html>
