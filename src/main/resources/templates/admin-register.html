<!DOCTYPE html>
<html xmlns=th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>管理者登録</title>
  </head>
  <body>
	  <h1>管理者登録</h1>
	  <form action="admin" method="post">
		<select name="storeId" required>
			<option value="">下記から選択</option>
			//Controllerから渡されたstoresデータを1件ずつ取り出し、その1件をstoreと名付ける
			<option th:each="store :${stores}"
					//取り出した1件のidデータをサーバに送信する
					th:value="${store.id}"
					//取り出した1件のnameを画面に出力する
					th:text="${store.storeName}">
			</option>
		</select><br>
		<input type="text"  name="lastName" placeholder="姓" required><br>
		<input type="text"  name="firstName" placeholder="名" required><br>
		<input type="email"  name="email" placeholder="メールアドレス" required></br>
		<select name="positionId" required>
			<option value="">下記から選択</option>
			<option th:each="position:${positions}"
					th:value="${position.id}"
					th:text="${position.positionName}">
			</option>
		</select><br>
		<select name="authorityId" required>
			<option value="">下記から選択</option>
			<option th:each="authority:${authorities}"
					th:value="${authority.id}"
					th:text="${authority.authorityName}">
			</option>
		</select><br>
		<input type="tel"  name="phoneNumber" placeholder="電話番号 ハイフン不要" maxlength="13" pattern="[0-9]{1,13}" required></br>
		<input type="password"  name="password" placeholder="パスワード" minlength="8" maxlength="64" required></br>
		<button type="submit">登録</button>
	  </form>
  </body>


</html>
